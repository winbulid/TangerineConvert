name: Create Release from Artifact

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Download latest build artifact
        uses: dawidd6/action-download-artifact@v6
        with:
          workflow: setup-only.yml
          name: Tangerine-Setup
          path: ./artifact

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: Tangerine v1.0.0
          generate_release_notes: true
          files: artifact/**
